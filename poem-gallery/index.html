<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Poem Gallery</title>
</head>

<body>

    <h1>Virtual Poem Gallery</h1>

    <div id="wall-west">
        <h2>West Wall</h2>

        <article id="poem-1">
            <h3>Morning</h3>
            <p>The sun rises over the quiet town.</p>
        </article>

        <article id="poem-2">
            <h3>Rain</h3>
            <p>Raindrops fall softly from the sky.</p>
        </article>
    </div>

    <div id="wall-east">
        <h2>East Wall</h2>

        <article id="poem-3">
            <h3>Night</h3>
            <p>The moon shines brightly above.</p>
        </article>

        <article id="poem-4">
            <h3>Dreams</h3>
            <p>Dreams carry us to distant places.</p>
        </article>
    </div>

    <h2>Add a New Poem</h2>

    <input type="text" id="poem-title" placeholder="Poem title">

    <br><br>

    <textarea id="poem-text" placeholder="Enter your poem"></textarea>

    <br><br>

    <label for="wall-choice">Choose a wall:</label>

    <select id="wall-choice">
        <option value="wall-west">West Wall</option>
        <option value="wall-east">East Wall</option>
    </select>

    <br><br>

    <label for="poem-color">Choose a color:</label>

    <input type="color" id="poem-color">

    <br><br>

    <button id="add-poem">Add Poem</button>

    <script src="script.js"></script>

</body>
</html>
